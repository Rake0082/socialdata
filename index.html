<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crime Visualizations</title>
  <style>
    /* General Styles */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px;
    }
    
    /* Interactive Crime Visualizations */
    .interactive-section {
      margin-bottom: 40px;
    }
    
    .interactive-section h2 {
      color: #333;
      font-size: 24px;
      margin-bottom: 20px;
    }
    
    .interactive-section a {
      display: block;
      background-color: #007bff;
      color: #fff;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 4px;
      margin-bottom: 10px;
    }
    
    .interactive-section a:hover {
      background-color: #0056b3;
    }
    
    /* Static Crime Trends */
    .static-section {
      margin-bottom: 40px;
    }
    
    .static-section h2 {
      color: #333;
      font-size: 24px;
      margin-bottom: 20px;
    }
    
    .static-section a {
      display: block;
      background-color: #6c757d;
      color: #fff;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 4px;
      margin-bottom: 10px;
    }
    
    .static-section a:hover {
      background-color: #495057;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="interactive-section">
      <h2>Interactive Crime Visualizations</h2>
      <a href="crime_hourly_interactive.html">Explore Hourly Crime Patterns</a>
      <a href="sf_crime_heatmap.html">View Crime Heatmap</a>
    </div>

    <div class="static-section">
      <h2>Static Crime Trends</h2>
      <a href="yearly_crime_trends.png">View Yearly Crime Trends</a>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crime Analytics Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* General Styles */
    body {
      font-family: 'Montserrat', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #c2b1b5;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 50px 20px;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header h1 {
      color: #52565c;
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .header p {
      color: #464e51;
      font-size: 16px;
      margin-top: 0;
    }

    /* Interactive Crime Visualizations */
    .interactive-section {
      margin-bottom: 40px;
    }

    .interactive-section h2 {
      color: #3d392a;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .interactive-section a {
      display: block;
      background-color: #4b6178;
      color: #fff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 6px;
      margin-bottom: 12px;
      transition: background-color 0.3s ease;
    }

    .interactive-section a:hover {
      background-color: #4b6178;
    }

    /* Static Crime Trends */
    .static-section {
      margin-bottom: 40px;
    }

    .static-section h2 {
      color: #333;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .static-section a {
      display: block;
      background-color: #99a3ac;
      color: #fff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 6px;
      margin-bottom: 12px;
      transition: background-color 0.3s ease;
    }

    .static-section a:hover {
      background-color: #495057;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Crime Analytics Dashboard</h1>
      <p>Explore interactive visualizations and static crime trends to gain insights.</p>
    </div>

    <div class="interactive-section">
      <h2>Interactive Crime Visualizations</h2>
      <a href="crime_hourly_interactive.html">Explore Hourly Crime Patterns</a>
      <a href="sf_crime_heatmap.html">View Crime Heatmap</a>
    </div>

    <div class="static-section">
      <h2>Static Crime Trends</h2>
      <a href="yearly_crime_trends.png">View Yearly Crime Trends</a>
    </div>
  </div>
</body>
</html>
